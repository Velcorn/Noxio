buildscript {
    ext {
        agp_version = '9.3.2'
        kotlin_version = '2.4.10'
        kotlin_coroutines_version = '1.11.0'
        navigation_version = "2.10.0"
        hilt_version = '2.60.1'
        room_version = '2.8.4'
        core_version = '1.19.0'
        desugaring_version = '2.1.3'

        min_sdk = 24
        target_sdk = 37
        ndk_version = "28.2.13676358"

    }

    dependencies {
        // Hilt isn't compatible with the new plugin syntax yet.
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "org.jetbrains.dokka:dokka-gradle-plugin:2.2.0"
    }
}

plugins {
    // Android studio doesn't understand this syntax
    //noinspection GradlePluginVersion
    id "com.android.application" version "$agp_version" apply false
    id "androidx.navigation.safeargs.kotlin" version "$navigation_version" apply false
    //noinspection GradlePluginVersion
    id 'com.android.library' version "$agp_version" apply false
    id "org.jetbrains.kotlin.plugin.parcelize" version "$kotlin_version" apply false
    id "com.google.devtools.ksp" version '2.3.6' apply false
    // We use spotless in the root build.gradle to apply to all modules.
    id "com.diffplug.spotless" version "8.10.1" apply true
}

spotless {
    kotlin {
        target "*/src/**/*.kt"
        ktfmt().kotlinlangStyle()
        licenseHeaderFile("NOTICE")
    }

    cpp {
        target("*/src/**/cpp/*.cpp", "*/src/**/cpp/*.h", "*/src/**/cpp/*.hpp")
        eclipseCdt().configFile("eclipse-cdt.xml")
        licenseHeaderFile("NOTICE")
    }
}

apply plugin: "jacoco"

jacoco {
    toolVersion = "0.8.13"
}

// Coverage of all the code: the app and the music library. Only generated code (view and data
// binding, Hilt, Dagger, Room, navigation and resources) is left out. Code that has no tests counts
// as not covered, which is the point: the number shows what still needs tests.
def generatedCode = [
    "**/R.class", "**/R\$*.class", "**/BuildConfig.*", "**/databinding/**", "**/*Binding.class",
    "**/*Binding\$*.class", "**/Hilt_*", "**/*_Hilt*", "**/hilt_aggregated_deps/**",
    "**/dagger/hilt/**", "**/*_Factory*", "**/*_MembersInjector*", "**/Dagger*", "**/*_Impl*",
    "**/*Directions*", "**/*Args*", "**/*\$\$*",
]

tasks.register("coverageReport", JacocoReport) {
    group = "verification"
    description = "Runs the unit tests of the app and musikr and writes one coverage report."
    dependsOn ":app:testDebugUnitTest", ":musikr:testDebugUnitTest"
    ["app", "musikr"].each { name ->
        def module = project(":$name")
        classDirectories.from(
            fileTree(
                dir: module.layout.buildDirectory.dir("intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes"),
                excludes: generatedCode,
            )
        )
        sourceDirectories.from(module.files("src/main/java"))
        executionData.from(
            module.layout.buildDirectory.file("outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec")
        )
    }
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// Coverage of Noxio's own code: the files listed in noxio-code.txt, which are the ones Noxio added.
// The all-code report above is dominated by Auxio and the music library, which Noxio did not write.
def noxioClasses = file("noxio-code.txt").readLines()
    .collect { it.trim() }
    .findAll { it && !it.startsWith("#") }
    .collectMany { path ->
        def dir = path.contains("/") ? path.substring(0, path.lastIndexOf("/") + 1) : ""
        def name = path.substring(path.lastIndexOf("/") + 1).replace(".kt", "")
        // The class itself, its nested classes, and the class Kotlin makes for top-level functions.
        ["org/oxycblt/auxio/${dir}${name}.class", "org/oxycblt/auxio/${dir}${name}\$*.class",
         "org/oxycblt/auxio/${dir}${name}Kt.class", "org/oxycblt/auxio/${dir}${name}Kt\$*.class"]
    }

tasks.register("noxioCoverageReport", JacocoReport) {
    group = "verification"
    description = "Runs the unit tests and writes a coverage report of the files Noxio added."
    dependsOn ":app:testDebugUnitTest"
    def module = project(":app")
    classDirectories.from(
        fileTree(
            dir: module.layout.buildDirectory.dir("intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes"),
            includes: noxioClasses,
            excludes: generatedCode,
        )
    )
    sourceDirectories.from(module.files("src/main/java"))
    executionData.from(
        module.layout.buildDirectory.file("outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec")
    )
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
