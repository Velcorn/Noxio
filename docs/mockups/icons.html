<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noxio Icon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: the final icon ("Crescent and Sparkle") and everything derived from it, as cards in a grid.
   Everything is drawn from the same shapes as the Android resources in app/src/main/res/drawable. */
:root { --bg:#f1f1f6; --surface:#fff; --surface-2:#e8e8f1; --fg:#16162b; --muted:#5d5d7a; --line:#d6d6e4; --accent:#4b3fd1;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --font-body:"DM Sans",system-ui,sans-serif; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg:#000; --surface:#0c0c10; --surface-2:#1a1a22; --fg:#ececf8; --muted:#9b9bbd; --line:#25252f; --accent:#a79dff; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 var(--font-body); padding:32px 16px; }
.wrap { max-width: 980px; margin: 0 auto; }
h1 { font:800 34px/1.1 var(--font-display); margin:0 0 6px; }
.lead { color:var(--muted); max-width:64ch; margin:0 0 20px; }
.bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:24px; }
.bar span { color:var(--muted); font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-right:4px; }
.bar button { border:1px solid var(--line); background:var(--surface); color:var(--fg); border-radius:18px; padding:7px 16px; font:600 14px var(--font-body); cursor:pointer; }
.bar button[aria-pressed="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
.bar button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:28px; padding:22px; display:flex; flex-direction:column; gap:14px; min-width:0; }
.card.wide { grid-column: 1 / -1; }
.card h2 { font:800 20px/1.2 var(--font-display); margin:0; }
.card p { margin:0; color:var(--muted); font-size:14px; }
.stage { display:grid; place-items:center; background:#000; border-radius:22px; padding:24px; }
.row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; }
.tile { display:flex; flex-direction:column; align-items:center; gap:6px; }
.cap { font-size:12px; color:var(--muted); text-align:center; }
.ico { overflow:hidden; display:block; }
.round { border-radius:50%; } .squircle { border-radius:34%; } .rsquare { border-radius:22%; }
.checker { background:repeating-conic-gradient(#2a2a33 0 25%, #1c1c24 0 50%) 0 0 / 16px 16px; border-radius:14px; display:block; }
.homes { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; }
.home { border-radius:26px; padding:18px 14px; display:grid; grid-template-columns:repeat(4, 1fr); gap:14px 8px; justify-items:center; }
.home .ph { width:100%; aspect-ratio:1; border-radius:34%; opacity:.9; max-width:46px; }
.homelabel { grid-column:1/-1; font:600 12px var(--font-body); text-align:center; opacity:.8; }
.notif { background:#1f1f27; color:#ececf8; border-radius:22px; padding:12px 14px; display:flex; gap:12px; align-items:center; max-width:360px; }
.notif .txt b { display:block; font-size:14px; } .notif .txt span { font-size:12.5px; opacity:.7; }
.splash { width:150px; height:150px; border-radius:50%; display:grid; place-items:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Noxio icon</h1>
  <p class="lead"><b>Crescent and Sparkle</b>: a slim crescent moon, a play button in the exact middle, and a sparkle. Pure black behind it for AMOLED screens, and a single-color layer that Material You tints on Android 13 and later.</p>
  <div class="bar" role="group" aria-label="Icon shape">
    <span>Launcher shape</span>
    <button data-shape="round" aria-pressed="true">Circle</button>
    <button data-shape="squircle" aria-pressed="false">Squircle</button>
    <button data-shape="rsquare" aria-pressed="false">Rounded square</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
(function () {
  var uid = 0;
  var CRESCENT = 'M69.818 28.509A30 30 0 1 0 69.818 79.491A27.5 27.5 0 1 1 69.818 28.509Z';
  var TRI = 'M47 41L47 67L68 54Z';
  var SPARK = 'M75 33Q76.4 36.6 80 38Q76.4 39.4 75 43Q73.6 39.4 70 38Q73.6 36.6 75 33Z';
  var shape = 'round';

  // The artwork on the 108 grid. mode: 'color' (gradient moon, white details) or 'mono' (one color).
  function art(mode, fg) {
    var id = ++uid;
    var moon = mode === 'mono' ? fg : 'url(#g' + id + ')', white = mode === 'mono' ? fg : '#fff';
    return '<defs><linearGradient id="g' + id + '" gradientUnits="userSpaceOnUse" x1="24" y1="24" x2="84" y2="84"><stop offset="0" stop-color="#ece6ff"/><stop offset="1" stop-color="#a79dff"/></linearGradient></defs>' +
      '<path d="' + CRESCENT + '" fill="' + moon + '"/>' +
      '<path d="' + TRI + '" fill="' + white + '" stroke="' + white + '" stroke-width="5" stroke-linejoin="round"/>' +
      '<path d="' + SPARK + '" fill="' + white + '"/>';
  }
  function icon(size, bg, mode, fg, extraClass) {
    return '<svg class="ico shape ' + shape + ' ' + (extraClass || '') + '" width="' + size + '" height="' + size + '" viewBox="0 0 108 108" role="img" aria-label="Noxio icon">' +
      (bg ? '<rect width="108" height="108" fill="' + bg + '"/>' : '') + art(mode, fg) + '</svg>';
  }
  // Layers shown without a mask.
  function layer(size, kind) {
    var inner = kind === 'bg' ? '<rect width="108" height="108" fill="#000"/>' : kind === 'fg' ? art('color') : art('mono', '#e3dbff');
    return '<svg class="checker" width="' + size + '" height="' + size + '" viewBox="0 0 108 108" role="img" aria-label="' + kind + ' layer">' + inner + '</svg>';
  }
  // The 24 dp white glyph for notifications, widgets and Android Auto.
  function glyph(size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" role="img" aria-label="Notification glyph" fill="#fff">' +
      '<path d="M16.77 4.38A9 9 0 1 0 16.77 19.62A8.25 8.25 0 1 1 16.77 4.38Z"/>' +
      '<path d="M9.9 8.1L9.9 15.9L16.2 12Z" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>' +
      '<path d="M18.3 5.7Q18.72 6.78 19.8 7.2Q18.72 7.62 18.3 8.7Q17.88 7.62 16.8 7.2Q17.88 6.78 18.3 5.7Z"/></svg>';
  }
  var tints = [
    { name: 'Violet', bg: '#e6deff', fg: '#3b2e7e' }, { name: 'Moss', bg: '#cdebcf', fg: '#1d4b25' },
    { name: 'Peach', bg: '#ffdcc7', fg: '#6a3112' }, { name: 'Dark violet', bg: '#2f2b45', fg: '#e3dbff' }
  ];
  function ph(color) { return '<div class="ph" style="background:' + color + '"></div>'; }
  function home(label, wall, text, phColors, noxio) {
    var cells = phColors.map(ph);
    cells.splice(5, 0, '<div class="tile">' + noxio + '</div>');
    return '<div class="home" style="background:' + wall + ';color:' + text + '">' + cells.join('') + '<div class="homelabel">' + label + '</div></div>';
  }
  function render() {
    var neutral = ['#4b4b57', '#5a5a66', '#3d3d48', '#62626e', '#454551', '#565662', '#4a4a56'];
    var light = ['#c9c9d6', '#bdbdcc', '#d4d4df', '#c0c0cf', '#cfcfdc', '#b9b9c9', '#d0d0dc'];
    document.getElementById('grid').innerHTML =
      '<section class="card"><h2>App icon</h2><p>Full color on pure black, as the adaptive icon looks with the launcher mask you chose above.</p><div class="stage">' + icon(180, '#000', 'color') + '</div>' +
      '<div class="row">' + [96, 64, 48, 36].map(function (s) { return '<div class="tile">' + icon(s, '#000', 'color') + '<div class="cap">' + s + ' px</div></div>'; }).join('') + '</div></section>' +

      '<section class="card"><h2>App icon choices</h2><p>Settings > Personalize > App icon. The default icon, or a flat white minimal version with no background, so it sits straight on your wallpaper. Launchers with themed icons tint the single-color layer instead.</p><div class="row">' +
      '<div class="tile">' + icon(88, '#000', 'color') + '<div class="cap">Default</div></div>' +
      '<div class="tile"><div style="width:88px;height:88px;border-radius:24px;overflow:hidden;background:linear-gradient(145deg,#3b3a68,#1c2a44 55%,#2d1f3a);display:grid;place-items:center">' + icon(88, null, 'mono', '#fff', 'noclip') + '</div><div class="cap">Minimal, on a wallpaper</div></div>' +
      '<div class="tile"><div style="width:88px;height:88px;border-radius:24px;overflow:hidden;background:linear-gradient(145deg,#ffd9a8,#f7a1b5 55%,#a99cff);display:grid;place-items:center">' + icon(88, null, 'mono', '#fff', 'noclip') + '</div><div class="cap">Minimal, on a light wallpaper</div></div></div></section>' +

      '<section class="card"><h2>Adaptive layers</h2><p>Android draws the icon from layers, so the launcher can mask, move and tint them.</p><div class="row">' +
      '<div class="tile">' + layer(96, 'bg') + '<div class="cap">Background</div></div>' +
      '<div class="tile">' + layer(96, 'fg') + '<div class="cap">Foreground</div></div>' +
      '<div class="tile">' + layer(96, 'mono') + '<div class="cap">Themed layer</div></div></div>' +
      '<p>The foreground keeps the moon, the button and the sparkle inside the central 66 of 108 units, so no launcher shape can cut them off.</p></section>' +

      '<section class="card"><h2>Themed icon (Material You)</h2><p>On Android 13 and later the launcher tints the single-color layer with your wallpaper colors.</p><div class="row">' +
      tints.map(function (t) { return '<div class="tile">' + icon(72, t.bg, 'mono', t.fg) + '<div class="cap">' + t.name + '</div></div>'; }).join('') + '</div></section>' +

      '<section class="card"><h2>Splash and notification</h2><p>The splash screen shows the artwork on your theme color. The notification, widget and Android Auto use a small white glyph.</p><div class="row">' +
      '<div class="tile"><div class="splash" style="background:#000">' + icon(100, null, 'color', null, 'noclip') + '</div><div class="cap">Splash, AMOLED</div></div>' +
      '<div class="tile"><div class="splash" style="background:#e6deff">' + icon(100, null, 'color', null, 'noclip') + '</div><div class="cap">Splash, light</div></div></div>' +
      '<div class="notif">' + glyph(24) + '<div class="txt"><b>Noxio</b><span>Slow Dancing in the Dark</span></div></div>' +
      '<div class="row"><div class="tile">' + '<div style="background:#1f1f27;padding:10px;border-radius:12px">' + glyph(48) + '</div><div class="cap">Glyph at 48 px</div></div>' +
      '<div class="tile">' + '<div style="background:#1f1f27;padding:10px;border-radius:12px">' + glyph(24) + '</div><div class="cap">Actual size, 24 dp</div></div></div></section>' +

      '<section class="card wide"><h2>On a home screen</h2><p>With an AMOLED black wallpaper, and with themed icons on a Material You light and dark wallpaper.</p><div class="homes">' +
      home('AMOLED black', '#000', '#ddd', neutral, icon(46, '#000', 'color')) +
      home('Material You, light', '#efe9ff', '#3b2e7e', light, icon(46, '#e6deff', 'mono', '#3b2e7e')) +
      home('Material You, dark', '#1d1a2b', '#e3dbff', neutral, icon(46, '#2f2b45', 'mono', '#e3dbff')) +
      '</div></section>';
    document.querySelectorAll('.shape').forEach(function (el) { if (!el.classList.contains('noclip')) { el.setAttribute('class', 'ico shape ' + shape); } });
    document.querySelectorAll('.ico.noclip').forEach(function (el) { el.setAttribute('class', 'ico noclip'); });
  }
  document.querySelectorAll('.bar button').forEach(function (b) {
    b.onclick = function () {
      shape = b.dataset.shape;
      document.querySelectorAll('.bar button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    };
  });
  render();
})();
</script>
</body>
</html>
