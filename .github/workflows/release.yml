name: Release

# Push a tag like v1.0.0-dev.1 to build a signed release APK and publish it as a GitHub Release.
# Tags containing a hyphen (v1.0.0-dev.1) are marked as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "jetbrains"
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build release APK
      run: ./gradlew app:assembleRelease -PbuildNumber=${{ github.run_number }}
    - name: Rename APK
      run: cp app/build/outputs/apk/release/app-release.apk "Noxio-${{ github.ref_name }}.apk"
    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: Noxio-${{ github.ref_name }}.apk
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
