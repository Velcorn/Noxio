name: Release

# Push a tag like 1.0.0 (or v1.0.0-dev.1) to build a signed release APK and publish it as a GitHub Release.
# Tags containing a hyphen (v1.0.0-dev.1) are marked as pre-releases.
on:
  push:
    tags: ["[0-9]*", "v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-build
      - name: Restore the release key
        # Only a final release (no hyphen in the tag) is signed with the real key; dev builds keep
        # the throwaway key so they can update each other.
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          echo "${{ secrets.NOXIO_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NOXIO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "NOXIO_KEYSTORE_PASSWORD=${{ secrets.NOXIO_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "NOXIO_KEY_ALIAS=${{ secrets.NOXIO_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "NOXIO_KEY_PASSWORD=${{ secrets.NOXIO_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build release APK
        run: ./gradlew app:assembleRelease -PbuildNumber=${{ github.run_number }}
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Noxio-${{ github.ref_name }}.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Noxio-${{ github.ref_name }}.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
