name: Set up the build
description: Installs build tools, fetches submodules, and caches Gradle outputs and native libraries.

runs:
  using: composite
  steps:
    - name: Install ninja-build
      shell: bash
      run: sudo apt-get install -y ninja-build
    - name: Clone submodules
      # git.ffmpeg.org often returns 502 to CI runners, so use the GitHub mirror and retry.
      shell: bash
      run: |
        git config --global url."https://github.com/FFmpeg/FFmpeg.git".insteadOf https://git.ffmpeg.org/ffmpeg.git
        for i in 1 2 3; do
          git submodule update --init --force --depth=1 --recursive && exit 0
          echo "Submodule clone failed (attempt $i), retrying..."
          sleep 10
        done
        exit 1
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "temurin"
    - name: Set up Gradle output caching
      uses: gradle/actions/setup-gradle@v6.4.1
      with:
        # Per-job/commit snapshots avoid lint and tests competing for one immutable cache.
        cache-provider: enhanced
        # dev is the working branch; main supplies caches accessible to release tags too.
        cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}
    - name: Identify native build inputs
      id: native-inputs
      shell: bash
      run: |
        # Include nested FFmpeg, not only its parent Media3 revision.
        echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"
        echo "revisions=$(git submodule status --recursive | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    - name: Cache native libraries and generated headers
      uses: actions/cache@v6.1.0
      with:
        # Exact keys only: these upstream build tasks check whether directories exist.
        # A fallback from different sources or compiler flags would silently reuse stale binaries.
        key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-inputs.outputs.image }}-${{ steps.native-inputs.outputs.revisions }}-${{ hashFiles('build.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'musikr/build.gradle', 'musikr/src/main/cpp/build_taglib.sh', 'musikr/src/main/cpp/android.toolchain.cmake', 'musikr/src/main/cpp/CMakeLists.txt', 'media/libraries/decoder_ffmpeg/build.gradle.kts', 'media/libraries/decoder_ffmpeg/src/main/jni/build_ffmpeg.sh', 'media/libraries/decoder_ffmpeg/src/main/jni/CMakeLists.txt') }}
        path: |
          musikr/src/main/cpp/taglib/pkg
          media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/android-libs
          media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/config.h
          media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/config_components.h
          media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/avconfig.h
          media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/ffversion.h
    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew
