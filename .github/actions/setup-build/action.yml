name: Set up the build
description: Installs ninja and JDK 21 and fetches the submodules (with a retry and the ffmpeg mirror).

runs:
  using: composite
  steps:
    - name: Install ninja-build
      shell: bash
      run: sudo apt-get install -y ninja-build
    - name: Clone submodules
      # git.ffmpeg.org often returns 502 to CI runners, so use the GitHub mirror and retry.
      shell: bash
      run: |
        git config --global url."https://github.com/FFmpeg/FFmpeg.git".insteadOf https://git.ffmpeg.org/ffmpeg.git
        for i in 1 2 3; do
          git submodule update --init --force --depth=1 --recursive && exit 0
          echo "Submodule clone failed (attempt $i), retrying..."
          sleep 10
        done
        exit 1
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"
        cache: gradle
    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew
